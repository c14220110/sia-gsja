openapi: 3.0.0
info:
  title: SIM GSJA API
  version: 1.0.0
  description: "REST API untuk **Sistem Informasi Manajemen Gereja GSJA**.\n\n## Autentikasi\n\
    Semua endpoint (kecuali `/api/auth/*`) memerlukan **Bearer Token JWT**.\n\nSertakan\
    \ header berikut di setiap request:\n```\nAuthorization: Bearer <your_token>\n\
    ```\n\n## Struktur Response\nSemua endpoint mengembalikan format standar:\n```json\n\
    {\n  \"success\": true,\n  \"data\": { ... },\n  \"message\": \"\"\n}\n```"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
