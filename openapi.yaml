openapi: 3.0.0
info:
  title: SIA GSJA API (Current Version)
  version: 1.0.0
  description: Dokumentasi otomatis terbaru dari seluruh modul skripsi SIA GSJA, mengecualikan Penggajian, Pengurus, Pegawai, Jurnal.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: https://gsja.vercel.app
    description: Production Server GSJA Eben Haezer
tags:
  - name: Otentikasi & Keamanan
    description: Modul Login, RBAC, dan Audit Log
  - name: Dashboard BSC
    description: Modul Dashboard Balanced Scorecard dan Indikator Kinerja
  - name: Jemaat & Partisipan
    description: Modul Manajemen Data Jemaat, Pohon Keluarga, dan Partisipan
  - name: Kegiatan & Presensi
    description: Modul Manajemen Kegiatan, Presensi QR, dan Registrasi Mandiri
  - name: Anggaran
    description: Modul Rancangan Anggaran dan Laporan Pertanggungjawaban (LPJ)
  - name: Penjadwalan Pelayan
    description: Modul Manajemen Jadwal Pelayan dan Absensi Pelayan
  - name: Layanan Pastoral
    description: Modul Permohonan Layanan Pastoral dan Penugasan Eksekutor
  - name: Survei Kepuasan
    description: Modul Survei Kepuasan Jemaat dan Tindak Lanjut Keluhan
paths:
  /api/anggaran/kegiatan-options:
    get:
      tags:
        - Anggaran
      summary: GET /api/anggaran/kegiatan-options
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
